<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store"><title>CodeProof</title></head><body><div style="font:16px system-ui;padding:24px">Loading CodeProof…</div><script>(async()=>{try{const names=["part0.bin","part1.bin","part2.bin","part3.bin"];const chunks=[];let total=0;for(const n of names){const r=await fetch(n+'?v=3',{cache:'no-store'});if(!r.ok)throw new Error('Missing '+n);const b=new Uint8Array(await r.arrayBuffer());chunks.push(b);total+=b.length}const all=new Uint8Array(total);let o=0;for(const b of chunks){all.set(b,o);o+=b.length}const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([all]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;color:#b91c1c;padding:24px">CodeProof loader failed: '+String(e)+'</pre>';console.error(e)}})();</script></body></html>
