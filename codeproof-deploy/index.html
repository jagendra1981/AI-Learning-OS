<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>CodeProof</title></head><body><div id="cpboot" style="font:16px system-ui;padding:24px">Loading CodeProof…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/jagendra1981/AI-Learning-OS/codeproof-vercel-deploy/codeproof-deploy/';const names=['part0.bin','part1.bin','part2.bin','part3.bin'];const chunks=[];let total=0;for(const n of names){const r=await fetch(base+n+'?v=authgate4',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);const b=new Uint8Array(await r.arrayBuffer());chunks.push(b);total+=b.length}const all=new Uint8Array(total);let o=0;for(const b of chunks){all.set(b,o);o+=b.length}const html=await new Response(new Blob([all]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const patch=`<script>
(function(){
  const ROLE_KEY='codeproof-pending-role-v1';
  const originalLayout=window.layout;
  if(typeof originalLayout==='function'){
    window.layout=function(content,roleLabel='Workspace'){
      return originalLayout(content,roleLabel).replace(' • Local demo',' • Signed out');
    };
  }
  window.login=async function(role){
    if(!authUser){
      try{localStorage.setItem(ROLE_KEY,role)}catch(_){ }
      cloudMessage='Sign in with your email to open the '+(role==='faculty'?'Faculty':'Student')+' workspace.';
      state.role=null; save(); home();
      setTimeout(()=>document.getElementById('auth-email')?.focus(),0);
      return;
    }
    if(!cloudProfile){
      cloudMessage='Your account is signed in but no CodeProof profile is assigned yet.';
      state.role=null; save(); home(); return;
    }
    if(role==='faculty'&&!['faculty','admin'].includes(cloudProfile.role)){
      alert('This account is not authorized for the Faculty workspace.'); return;
    }
    if(role==='student'&&cloudProfile.role!=='student'){
      alert('This account is not assigned the Student role.'); return;
    }
    if(role==='student'){
      const loaded=await loadPublishedAssessment();
      if(!loaded){state.role=null;save();home();return;}
      await ensureCloudSession();
      await loadQuestionSubmissionState();
    }
    if(role==='faculty'&&typeof loadFacultyWorkspace==='function') await loadFacultyWorkspace();
    try{localStorage.removeItem(ROLE_KEY)}catch(_){ }
    state.role=role;
    if(role==='student'&&!state.startedAt){state.startedAt=stamp();event('Session started','Student opened assessment')}
    save(); render();
  };
  window.render=function(){
    if(!authUser||!cloudProfile){
      if(state.role){state.role=null;save()}
      home(); return;
    }
    state.role==='faculty'?faculty():state.role==='student'?student():home();
  };
  if(!authUser&&state.role){state.role=null;save();home();}
})();
<\/script>`;const fixed=html.replaceAll('Local CodeProof mode is still available.','Please sign in to continue.').replace('</body>',patch+'</body>');document.open();document.write(fixed);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;color:#b91c1c;padding:24px">CodeProof failed to load: '+String(e)+'</pre>';console.error(e)}})();</script></body></html>
